openapi: 3.0.0
info:
  title: Category API
  version: 1.0.0
  description: Category management endpoints for the Online Course Platform

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
  
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        courses:
          type: array
          items:
            type: object
        _count:
          type: object
          properties:
            courses:
              type: number
    
    CategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri
        isActive:
          type: boolean
    
    CategoryStats:
      type: object
      properties:
        total:
          type: number
        active:
          type: number
        withCourses:
          type: number

paths:
  /api/categories:
    get:
      summary: Get all categories
      tags: [Categories]
      parameters:
        - in: query
          name: withCourses
          schema:
            type: string
            enum: [true, false]
          description: Include courses in response
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    
    post:
      summary: Create a new category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '409':
          description: Category with this name already exists

  /api/categories/stats:
    get:
      summary: Get category statistics
      tags: [Categories]
      responses:
        '200':
          description: Category statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: '#/components/schemas/CategoryStats'

  /api/categories/with-course-count:
    get:
      summary: Get categories with course counts
      tags: [Categories]
      responses:
        '200':
          description: Categories with course counts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /api/categories/search:
    get:
      summary: Search categories
      tags: [Categories]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search term
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          description: Search query is required

  /api/categories/{id}:
    get:
      summary: Get category by ID
      tags: [Categories]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
    
    put:
      summary: Update category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '404':
          description: Category not found
        '409':
          description: Category with this name already exists
    
    delete:
      summary: Delete category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted successfully
        '400':
          description: Cannot delete category with existing courses
        '403':
          description: Forbidden
        '404':
          description: Category not found

  /api/categories/{id}/toggle-status:
    put:
      summary: Toggle category status (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden
        '404':
          description: Category not found

  /api/categories/{id}/image:
    put:
      summary: Upload category image (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Category image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
                  image:
                    type: object
        '400':
          description: No image uploaded
        '403':
          description: Forbidden
        '404':
          description: Category not found
    
    delete:
      summary: Remove category image (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category image removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden
        '404':
          description: Category not found
