openapi: 3.0.0
info:
  title: Course API
  version: 1.0.0
  description: Course management endpoints for the Online Course Platform

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
  
  schemas:
    Course:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        isPublished:
          type: boolean
        instructorId:
          type: string
        instructor:
          type: object
          properties:
            id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
        categoryId:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
            imageUrl:
              type: string
        isFeatured:
          type: boolean
        difficulty:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
        duration:
          type: integer
        language:
          type: string
        tags:
          type: array
          items:
            type: string
        lessons:
          type: array
          items:
            type: object
        _count:
          type: object
          properties:
            lessons:
              type: number
            enrollments:
              type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when course was soft deleted
    
    CourseRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: string
          format: uri
        isPublished:
          type: boolean
        categoryId:
          type: string
          description: Optional category ID to assign course to a category
        instructorId:
          type: string
          description: Optional instructor ID (Admin only - assign course to specific instructor)
        isFeatured:
          type: boolean
          description: Whether course is featured
        difficulty:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED, EXPERT]
          description: Course difficulty level
        duration:
          type: integer
          minimum: 1
          description: Course duration in minutes
        language:
          type: string
          description: Course language
        tags:
          type: array
          items:
            type: string
          description: Course tags
    
    CourseStats:
      type: object
      properties:
        total:
          type: number
        published:
          type: number
        totalEnrollments:
          type: number

paths:
  /api/courses:
    get:
      summary: Get all published courses
      tags: [Courses]
      responses:
        '200':
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
    
    post:
      summary: Create a new course (Instructor/Admin only)
      tags: [Courses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  course:
                    $ref: '#/components/schemas/Course'
        '400':
          description: Validation error
        '403':
          description: Forbidden

  /api/courses/trending:
    get:
      summary: Get trending courses (cached)
      tags: [Courses]
      responses:
        '200':
          description: Trending courses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  trendingCourses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'

  /api/courses/search:
    get:
      summary: Search courses
      tags: [Courses]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search term
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: price
          schema:
            type: number
        - in: query
          name: level
          schema:
            type: string
      responses:
        '200':
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'

  /api/courses/stats:
    get:
      summary: Get course statistics (Admin only)
      tags: [Courses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Course statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseStats'
        '403':
          description: Forbidden

  /api/courses/{id}:
    get:
      summary: Get course by ID
      tags: [Courses]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  course:
                    $ref: '#/components/schemas/Course'
        '404':
          description: Course not found
    
    put:
      summary: Update course (Instructor/Admin only)
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '200':
          description: Course updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  course:
                    $ref: '#/components/schemas/Course'
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '404':
          description: Course not found
    
    delete:
      summary: Soft delete course (Instructor/Admin only)
      description: Soft deletes the course by setting deletedAt timestamp and unpublishing it. Course data is preserved for recovery.
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course soft deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden
        '404':
          description: Course not found

  /api/courses/instructor/{instructorId}:
    get:
      summary: Get courses by instructor
      tags: [Courses]
      parameters:
        - in: path
          name: instructorId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'

  /api/courses/deleted:
    get:
      summary: Get soft deleted courses (Admin only)
      tags: [Courses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted courses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Course'
        '403':
          description: Forbidden - Admin access required

  /api/courses/{id}/restore:
    patch:
      summary: Restore soft deleted course (Admin only)
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  course:
                    $ref: '#/components/schemas/Course'
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Course not found

  /api/courses/{id}/hard-delete:
    delete:
      summary: Permanently delete course (Admin only)
      tags: [Courses]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden - Admin access required
        '404':
          description: Course not found 